name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Type-check guest gateway
        run: npx tsc --project tsconfig.guest.json
      - name: Test anonymous check-in security
        run: node --test tests/guest-checkin.test.mjs tests/checkin-photo.test.mjs

  mobile-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install shared web dependencies
        run: npm ci
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Type-check mobile
        run: npx tsc --noEmit
        working-directory: mobile
