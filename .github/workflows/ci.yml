name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  mobile-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install shared web dependencies
        run: npm ci
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Type-check mobile
        run: npx tsc --noEmit
        working-directory: mobile

  checkin-motoko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dfinity/setup-dfx@main
        with:
          dfx-version: "0.30.2"
      - name: Compile check-in canister
        run: |
          dfx start --background
          dfx canister create checkin
          dfx build checkin

      - name: Anonymous ICP check-in smoke test
        run: |
          dfx deploy checkin
          dfx canister call checkin createLocation '("CI location", "Trail guestbook", 49.0, -122.0)' | grep -q 'ok'
          dfx --identity anonymous canister call checkin checkIn '(1, "Guest", "Hello from CI")' | grep -q 'ok'
          dfx --identity anonymous canister call checkin listCheckIns '(1, 0, 10)' | grep -q 'Hello from CI'
          dfx canister call checkin setLocationActive '(1, false)' | grep -q 'ok'
          dfx --identity anonymous canister call checkin checkIn '(1, "", "After closing")' | grep -q 'closed'
      - name: Preserve public notes across canister upgrade
        run: |
          dfx deploy checkin --mode upgrade
          dfx --identity anonymous canister call checkin listCheckIns '(1, 0, 10)' | grep -q 'Hello from CI'
          dfx --identity anonymous canister call checkin listLocations '(0, 10)' | grep -q 'CI location'
