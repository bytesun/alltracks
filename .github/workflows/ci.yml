name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  mobile-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install shared web dependencies
        run: npm ci
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Type-check mobile
        run: npx tsc --noEmit
        working-directory: mobile

  object-journey-motoko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dfx
        uses: dfinity/setup-dfx@main
        with:
          dfx-version: '0.30.2'
      - name: Compile Object Journey canister
        run: |
          dfx start --background --clean
          dfx canister create object_journey
          dfx build object_journey
      - name: Anonymous location check-in and ICP readback
        run: |
          dfx canister install object_journey
          dfx canister call object_journey getCheckins '("cup-7h9m4k")' --query
          dfx --identity anonymous canister call object_journey addCheckin '("cup-7h9m4k", record { latitude = 49.177777; longitude = -122.633333; accuracyMeters = opt 20; action = variant { found }; note = "CI checkpoint" })' | grep -q 'ok'
          dfx canister call object_journey getCheckins '("cup-7h9m4k")' --query | grep -q 'CI checkpoint'
          dfx canister install object_journey --mode upgrade
          dfx canister call object_journey getCheckins '("cup-7h9m4k")' --query | grep -q 'CI checkpoint'
